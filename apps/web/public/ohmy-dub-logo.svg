<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>

    <linearGradient id="textGradient" x1="200" y1="100" x2="1000" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" rx="32" fill="url(#bg)"/>

  <!-- Decorative Circles -->
  <circle cx="150" cy="90" r="80" fill="#38BDF8" opacity="0.08"/>
  <circle cx="1050" cy="300" r="120" fill="#22D3EE" opacity="0.08"/>

  <!-- Main Text -->
  <text
    x="50%"
    y="50%"
    dominant-baseline="middle"
    text-anchor="middle"
    font-family="Poppins, Arial, sans-serif"
    font-size="120"
    font-weight="700"
    letter-spacing="2"
    fill="url(#textGradient)"
    filter="url(#glow)">
    OhMyDub
  </text>

  <!-- Subtitle -->
  <text
    x="50%"
    y="72%"
    dominant-baseline="middle"
    text-anchor="middle"
    font-family="Inter, Arial, sans-serif"
    font-size="28"
    font-weight="400"
    fill="#CBD5E1"
    opacity="0.9">
    AI Video Dubbing Platform
  </text>
</svg>
